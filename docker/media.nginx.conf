server {
    listen 3006;
    server_name _;

    root /srv/media;
    autoindex off;

    # Range requests so the browser can seek inside the processed MP4
    add_header Accept-Ranges bytes always;
    add_header Access-Control-Allow-Origin "http://localhost:3007" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /processed/ {
        try_files $uri =404;
    }

    location /thumbs/ {
        try_files $uri =404;
    }

    # Uploads are not publicly served
    location /uploads/ {
        deny all;
    }

    location / {
        return 404;
    }
}
